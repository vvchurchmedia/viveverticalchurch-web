<div style="font-family: Arial, sans-serif; max-width: 600px; color: #333;">
  <h2 style="color: #14261C;">Nuevo visitante</h2>
  <table style="width: 100%; border-collapse: collapse;">
    <tr><td style="padding: 8px; font-weight: bold;">Nombre:</td><td style="padding: 8px;">{{name}}</td></tr>
    <tr><td style="padding: 8px; font-weight: bold;">Email:</td><td style="padding: 8px;">{{email}}</td></tr>
    <tr><td style="padding: 8px; font-weight: bold;">Teléfono:</td><td style="padding: 8px;">{{phone}}</td></tr>
    <tr><td style="padding: 8px; font-weight: bold;">Dirección:</td><td style="padding: 8px;">{{address}}</td></tr>
  </table>
  <div style="background-color: #f7f9f8; border-radius: 8px; padding: 16px; margin-top: 16px;">
    <p style="font-weight: bold; margin-top: 0;">Intereses:</p>
    <p>{{interests}}</p>
  </div>
</div>
